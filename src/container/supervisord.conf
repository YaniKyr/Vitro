; supervisord.conf - process manager inside the inference container (PID 1).
; Starts one program: guard.py, which starts the ONNX Runtime server as its child,
; watches its output for GPU faults and records why it exited (/run/vitro/exit.json).
; When the server is gone guard.py stops supervisord, so the container exits and
; the IWMR decides on recovery: nothing is restarted inside the container.
; All output goes to the container's stdout/stderr, so `docker logs` shows it.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:onnx]
; the observer library is preloaded into the server only, not into guard.py
command=python3 /app/guard.py -- env LD_PRELOAD=/opt/vitro/libvitroobs.so python3 /app/server.py
directory=/app
autostart=true
autorestart=false               ; after a GPU fault the context is gone; the IWMR re-places
startsecs=0
stopsignal=TERM                 ; guard.py forwards it to the server
stopwaitsecs=20                 ; guard.py sends SIGKILL itself after STOP_TIMEOUT_S (15)
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
