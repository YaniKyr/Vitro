; supervisord.conf - process manager inside the inference container (PID 1).
; Starts two programs: the ONNX Runtime server and guard.py.
; All output goes to the container's stdout/stderr, so `docker logs` shows it.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:onnx]
command=python3 /app/server.py
directory=/app
autostart=true
autorestart=unexpected          ; restart on a crash, not on a clean exit
startsecs=5                     ; must stay up 5 s to count as started
startretries=3
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:guard]
command=python3 /app/guard.py
directory=/app
autostart=true
; guard.py is still a placeholder that exits at once. Until it is implemented,
; accept an immediate clean exit and do not restart it.
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
